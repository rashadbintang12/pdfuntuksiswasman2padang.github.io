<style>
:root{--navy:#0a4a28;--blue:#13a14d;--sky:#e4f6ea;--bg:#f3faf5;--tx:#13271b;--mut:#58705f;--bd:#cbe5d4;--ok:#127a4b;--err:#c0322b}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;color:var(--tx);background:var(--bg);line-height:1.55}
a{color:inherit}
button,select,input{font:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--bd)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.5px;color:var(--navy);text-decoration:none;font-size:1.15rem}
.logo img{width:40px;height:40px;object-fit:contain}.logo small{display:block;font-size:.68rem;font-weight:600;letter-spacing:0;color:var(--mut);line-height:1.1}.logo span{line-height:1.15}
nav a{margin-left:22px;text-decoration:none;color:var(--mut);font-weight:600}
nav a:hover{color:var(--blue)}
.hero{background:linear-gradient(135deg,#073d20,#0a6b34 65%,#13a14d);color:#fff;padding:40px 0 44px}
.hero .wrap{display:flex;align-items:center;justify-content:space-between;gap:32px}.hero-logo{flex:none;width:130px;height:130px;background:#fff;border-radius:28px;padding:16px;box-shadow:0 14px 40px rgba(0,0,0,.28)}.hero-logo img{width:100%;height:100%;object-fit:contain}.badge{display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);padding:5px 14px;border-radius:99px;font-weight:600;font-size:.9rem;margin-bottom:16px}@media(max-width:760px){.hero .wrap{flex-direction:column-reverse;align-items:flex-start}.hero-logo{width:130px;height:130px}}
.hero h1{font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.1;margin:0 0 8px}
.hero p{font-size:1.1rem;margin:0 0 20px;color:#d9f5e3}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 22px;font-weight:700;cursor:pointer;text-decoration:none;transition:transform .15s,background .15s,box-shadow .15s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 6px 18px rgba(19,161,77,.35)}
.btn-primary:hover:not(:disabled){background:#0d8a3e}
.btn-light{background:#fff;color:var(--navy)}
.btn-ghost{background:var(--sky);color:var(--navy)}
.btn-danger{background:#fdecea;color:var(--err)}
section{padding:36px 0 48px}
h2{color:var(--navy);margin:0 0 8px;font-size:1.7rem}
.sub{color:var(--mut);margin:0 0 24px}
#drop{border:2.5px dashed #86d0a1;background:#fff;border-radius:20px;padding:44px 20px;text-align:center;transition:background .2s,border-color .2s}
#drop.over{background:var(--sky);border-color:var(--blue)}
#drop svg{width:72px;height:72px;color:var(--blue)}
#drop h3{margin:8px 0 4px;color:var(--navy);font-size:1.3rem}
#drop small{display:block;margin-top:14px;color:var(--mut)}
#editor{display:none;margin-top:32px}
.grid{display:grid;grid-template-columns:270px 1fr 300px;gap:18px;align-items:start}
.card{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:16px}
.card h3{margin:0 0 12px;font-size:1rem;color:var(--navy)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
#list{display:flex;flex-direction:column;gap:8px;max-height:560px;overflow:auto;padding:2px}
.it{display:flex;gap:10px;align-items:center;border:1px solid var(--bd);border-radius:12px;padding:8px;background:#fff;cursor:grab}
.it.ghost{opacity:.4;background:var(--sky)}
.it img{width:52px;height:52px;object-fit:cover;border-radius:8px;background:#eee;flex:none}
.it .meta{min-width:0;flex:1;font-size:.82rem}
.it .meta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.88rem}
.it .meta span{color:var(--mut)}
.it .n{font-weight:700;color:var(--blue);font-size:.8rem;width:18px;text-align:center}
.it button{border:0;background:#fdecea;color:var(--err);border-radius:8px;width:28px;height:28px;cursor:pointer;font-weight:700}
#pvwrap{background:#dcece2;border-radius:12px;padding:20px;overflow:auto;max-height:600px;min-height:300px;text-align:center}
#cv{background:#fff;box-shadow:0 8px 26px rgba(10,74,40,.28);max-width:none}
.bar{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.bar .btn{padding:6px 12px;border-radius:10px}
.pill{font-weight:700;color:var(--navy);min-width:130px;text-align:center}
label{display:block;font-size:.85rem;font-weight:600;color:var(--navy);margin:10px 0 4px}
select,input[type=text]{width:100%;border:1px solid var(--bd);border-radius:10px;padding:9px 10px;background:#fff}
.chk{display:flex;gap:8px;align-items:flex-start;font-weight:500;margin-top:14px}
.chk input{margin-top:4px}
.act{margin-top:18px;display:grid;gap:10px}
#prog{display:none;height:10px;background:var(--sky);border-radius:99px;overflow:hidden}
#prog i{display:block;height:100%;width:0;background:var(--blue);transition:width .2s}
#done{display:none;gap:10px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.steps .card b{color:var(--blue);font-size:1.4rem}
footer{background:var(--navy);color:#cfeadb;padding:18px 0;font-size:.88rem;text-align:center}

footer a{margin-right:16px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);opacity:0;background:var(--navy);color:#fff;padding:12px 20px;border-radius:12px;transition:.3s;z-index:50;max-width:92vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{background:var(--err)}#toast.ok{background:var(--ok)}
@media(max-width:1000px){.grid{grid-template-columns:1fr}#list{max-height:300px}nav a{margin-left:12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

        <div class="bar">
          <button class="btn btn-ghost" id="prev" type="button" aria-label="Halaman sebelumnya">‹</button>
          <span class="pill" id="pg">Halaman 1 / 1</span>
          <button class="btn btn-ghost" id="next" type="button" aria-label="Halaman berikutnya">›</button>
          <button class="btn btn-ghost" id="zo" type="button" aria-label="Perkecil">−</button>
          <span id="zl" style="min-width:44px;text-align:center;font-weight:700">100%</span>
          <button class="btn btn-ghost" id="zi" type="button" aria-label="Perbesar">+</button>
        </div>
        <div id="pvwrap"><canvas id="cv"></canvas></div>
      </div>

      <div class="card">
        <h3>Pengaturan PDF</h3>
        <label for="size">Ukuran halaman</label>
        <select id="size"><option value="A4">A4</option><option value="A3">A3</option><option value="Letter">Letter</option><option value="orig">Ukuran asli gambar</option></select>
        <label for="orient">Orientasi</label>
        <select id="orient"><option value="p">Portrait</option><option value="l">Landscape</option></select>
        <label for="margin">Margin</label>
        <select id="margin"><option value="0">Tanpa margin</option><option value="8" selected>Kecil</option><option value="15">Sedang</option><option value="25">Besar</option></select>
        <label for="per">Gambar per halaman</label>
        <select id="per"><option value="1">1 gambar</option><option value="2">2 gambar</option><option value="4">4 gambar</option></select>
        <label for="quality">Kualitas gambar</label>
        <select id="quality"><option value="0.5">Rendah</option><option value="0.75" selected>Sedang</option><option value="0.92">Tinggi</option></select>
        <label for="name">Nama file PDF</label>
        <input id="name" type="text" value="tugas-siswa" maxlength="80">
        <label class="chk"><input type="checkbox" id="fit" checked><span>Pas di halaman (tidak dipotong)</span></label>
        <div class="act">
          <button class="btn btn-primary" id="convert" type="button">Convert to PDF</button>
          <div id="prog"><i></i></div>
          <div id="done"><button class="btn btn-primary" id="dl" type="button">Download PDF</button><button class="btn btn-ghost" id="again" type="button">Buat PDF Baru</button></div>
        </div>
      </div>
    </div>
  </div>
</div></section>

</main>

<footer><div class="wrap">© <span id="yr"></span> PDF FOR STUDENT · SMAN 2 Padang</div></footer>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const MAX=25*1024*1024, PX=25.4/96;
const BASE={A4:[210,297],A3:[297,420],Letter:[215.9,279.4]};
const MAXDIM={'0.5':1000,'0.75':1800,'0.92':3200};
let imgs=[],cur=0,zoom=1,pdfBlob=null,uid=0,pages=[],busy=false;
$('#yr').textContent=new Date().getFullYear();

function toast(msg,type){const t=$('#toast');t.textContent=msg;t.className='show '+(type||'');clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',3600)}
const fmt=b=>b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function getS(){return{size:$('#size').value,orient:$('#orient').value,margin:+$('#margin').value,per:+$('#per').value,quality:$('#quality').value,fit:$('#fit').checked,name:$('#name').value}}
function fileName(){let n=getS().name.replace(/[\\/:*?"<>|]+/g,'').trim().replace(/\.pdf$/i,'')||'tugas-siswa';return n+'.pdf'}

/* ---------- Upload ---------- */
async function addFiles(list){
  let bad=0,added=0;
  for(const f of list){
    const ok=/^image\/(jpeg|png)$/.test(f.type)||/\.(jpe?g|png)$/i.test(f.name);
    if(!ok){bad++;toast('Format tidak didukung: '+f.name,'err');continue}
    if(f.size>MAX){toast(f.name+' terlalu besar (maks. 25 MB).','err');continue}
    const url=URL.createObjectURL(f);
    try{
      const el=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
      if(!el.naturalWidth)throw 0;
      imgs.push({id:++uid,name:f.name,size:f.size,url,el,w:el.naturalWidth,h:el.naturalHeight});added++;
    }catch(e){URL.revokeObjectURL(url);toast('File rusak atau tidak bisa dibaca: '+f.name,'err')}
  }
  if(added)changed();
}
$('#pick').onclick=()=>$('#file').click();
$('#file').onchange=e=>{addFiles([...e.target.files]);e.target.value=''};
const dz=$('#drop');
['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('over')}));
['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('over')}));
dz.addEventListener('drop',e=>addFiles([...e.dataTransfer.files]));

/* ---------- List & order ---------- */
function renderList(){
  $('#cnt').textContent=imgs.length;
  $('#list').innerHTML=imgs.map((g,i)=>`<div class="it" data-id="${g.id}"><span class="n">${i+1}</span><img src="${g.url}" alt=""><div class="meta"><b title="${esc(g.name)}">${esc(g.name)}</b><span>${fmt(g.size)} · ${g.w}×${g.h}</span></div><button type="button" data-del="${g.id}" aria-label="Hapus ${esc(g.name)}">✕</button></div>`).join('');
}
$('#list').addEventListener('click',e=>{
  const id=e.target.dataset&&e.target.dataset.del;if(!id)return;
  const g=imgs.find(x=>x.id==id);if(g)URL.revokeObjectURL(g.url);
  imgs=imgs.filter(x=>x.id!=id);changed();
});
$('#clear').onclick=()=>{imgs.forEach(g=>URL.revokeObjectURL(g.url));imgs=[];changed()};
if(window.Sortable){
  new Sortable($('#list'),{animation:150,delay:120,delayOnTouchOnly:true,ghostClass:'ghost',onEnd(){
    const ids=[...$('#list').children].map(e=>+e.dataset.id);
    imgs=ids.map(id=>imgs.find(g=>g.id===id));changed();
  }});
}

function invalidate(){pdfBlob=null;$('#done').style.display='none';$('#convert').style.display='';$('#prog').style.display='none'}
function changed(){
  invalidate();
  $('#editor').style.display=imgs.length?'block':'none';
  renderList();render();
}

/* ---------- Layout (dipakai preview DAN PDF agar hasilnya identik) ---------- */
function layout(){
  const s=getS(),m=s.margin,orig=s.size==='orig',per=orig?1:s.per,out=[];
  for(let i=0;i<imgs.length;i+=per){
    const grp=imgs.slice(i,i+per);let W,H;
    if(orig){W=grp[0].w*PX+2*m;H=grp[0].h*PX+2*m}
    else{const b=BASE[s.size];[W,H]=s.orient==='l'?[b[1],b[0]]:b}
    const cols=per===4?2:(per===2&&W>H?2:1),rows=Math.ceil(per/cols),pad=per>1?2:0;
    const cw=(W-2*m)/cols,ch=(H-2*m)/rows,items=[];
    grp.forEach((g,k)=>{
      const c=k%cols,r=Math.floor(k/cols),bw=cw-2*pad,bh=ch-2*pad,ar=g.w/g.h;
      let w=bw,h=w/ar;if(h>bh){h=bh;w=h*ar}
      if(!s.fit){const ow=g.w*PX;if(w>ow){w=ow;h=w/ar}}
      items.push({g,x:m+c*cw+pad+(bw-w)/2,y:m+r*ch+pad+(bh-h)/2,w,h});
    });
    out.push({w:W,h:H,items});
  }
  return out;
}

/* ---------- Preview ---------- */
function render(){
  const s=getS(),orig=s.size==='orig';
  $('#orient').disabled=orig;$('#per').disabled=orig;
  pages=layout();
  if(cur>=pages.length)cur=Math.max(0,pages.length-1);
  const cv=$('#cv'),ctx=cv.getContext('2d'),p=pages[cur];
  $('#pg').textContent=p?`Halaman ${cur+1} / ${pages.length}`:'Belum ada halaman';
  $('#prev').disabled=cur<=0;$('#next').disabled=cur>=pages.length-1;
  $('#zl').textContent=Math.round(zoom*100)+'%';
  $('#convert').disabled=!imgs.length||busy;
  if(!p){cv.width=cv.height=0;return}
  const avail=Math.max(200,Math.min(560,$('#pvwrap').clientWidth-40||560));
  const cssW=(p.w>p.h?avail*1.25:avail)*zoom,k=cssW/p.w,dpr=window.devicePixelRatio||1;
  cv.style.width=cssW+'px';cv.style.height=p.h*k+'px';
  cv.width=Math.round(cssW*dpr);cv.height=Math.round(p.h*k*dpr);
  const f=cv.width/p.w;
  ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.imageSmoothingQuality='high';
  p.items.forEach(it=>ctx.drawImage(it.g.el,it.x*f,it.y*f,it.w*f,it.h*f));
}
$('#prev').onclick=()=>{cur--;render()};
$('#next').onclick=()=>{cur++;render()};
$('#zi').onclick=()=>{zoom=Math.min(3,zoom+.25);render()};
$('#zo').onclick=()=>{zoom=Math.max(.5,zoom-.25);render()};
['size','orient','margin','per','quality','fit'].forEach(id=>$('#'+id).addEventListener('change',()=>{invalidate();render()}));
$('#name').addEventListener('input',invalidate);
window.addEventListener('resize',()=>{if(imgs.length)render()});

/* ---------- Konversi ---------- */
function toJpeg(g,maxDim,q){
  const sc=Math.min(1,maxDim/Math.max(g.w,g.h)),c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(g.w*sc));c.height=Math.max(1,Math.round(g.h*sc));
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
  x.imageSmoothingQuality='high';x.drawImage(g.el,0,0,c.width,c.height);
  const d=c.toDataURL('image/jpeg',q);c.width=c.height=0;return d;
}
async function convert(){
  if(!imgs.length)return toast('Tambahkan gambar terlebih dahulu.','err');
  if(!(window.jspdf&&window.jspdf.jsPDF))return toast('Library PDF gagal dimuat. Cek internet lalu muat ulang.','err');
  busy=true;$('#convert').disabled=true;pdfBlob=null;
  const bar=$('#prog');bar.style.display='block';bar.firstElementChild.style.width='0';
  try{
    const s=getS(),pgs=layout(),q=+s.quality,md=MAXDIM[s.quality],cache=new Map();let doc;
    for(let i=0;i<pgs.length;i++){
      const p=pgs[i],o=p.w>p.h?'l':'p';
      if(i===0)doc=new window.jspdf.jsPDF({unit:'mm',format:[p.w,p.h],orientation:o,compress:true});
      else doc.addPage([p.w,p.h],o);
      for(const it of p.items){
        let d=cache.get(it.g.id);if(!d){d=toJpeg(it.g,md,q);cache.set(it.g.id,d)}
        doc.addImage(d,'JPEG',it.x,it.y,it.w,it.h,undefined,'FAST');
      }
      bar.firstElementChild.style.width=Math.round((i+1)/pgs.length*100)+'%';
      await new Promise(r=>setTimeout(r,0));
    }
    pdfBlob=doc.output('blob');cache.clear();
    $('#convert').style.display='none';bar.style.display='none';$('#done').style.display='grid';
    toast('PDF berhasil dibuat','ok');
  }catch(e){
    bar.style.display='none';toast('Konversi gagal: '+(e&&e.message||'terjadi kesalahan'),'err');
  }finally{busy=false;$('#convert').disabled=!imgs.length}
}
$('#convert').onclick=convert;

/* ---------- Download & reset ---------- */
$('#dl').onclick=()=>{
  if(!pdfBlob)return;
  const u=URL.createObjectURL(pdfBlob),a=document.createElement('a');
  a.href=u;a.download=fileName();document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
};
$('#again').onclick=()=>{
  imgs.forEach(g=>URL.revokeObjectURL(g.url));imgs=[];pdfBlob=null;cur=0;zoom=1;
  $('#name').value='tugas-siswa';changed();
  window.scrollTo({top:$('#mulai').offsetTop-70,behavior:'smooth'});
};
window.addEventListener('beforeunload',()=>imgs.forEach(g=>URL.revokeObjectURL(g.url)));
})();
</script>
</body>
</html>
